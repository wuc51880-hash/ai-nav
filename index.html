<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI导航</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
background: linear-gradient(135deg,#e0e7ff,#f8fafc);
}
.glass{
background: rgba(255,255,255,0.7);
backdrop-filter: blur(20px);
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}
.card:hover{
transform: translateY(-6px);
transition:0.3s;
}
</style>
</head>

<body class="p-6 font-sans">

<div class="grid grid-cols-[260px_1fr] gap-6">

<!-- 左侧 -->
<div class="glass p-5 space-y-6">
<h1 class="text-xl font-bold text-indigo-600">🐱 AI猫导航</h1>

<div class="space-y-3">
<div>🏠 首页</div>
<div>🤖 AI工具</div>
<div>📚 分类</div>
</div>

<div class="glass p-3 text-sm">
🐱 我可以帮你找AI工具
</div>
</div>

<!-- 主体 -->
<div class="space-y-6">

<div class="glass p-6">
<h2 class="text-3xl font-bold mb-4">
发现最佳 <span class="text-indigo-500">AI工具</span>
</h2>
<input class="w-full p-4 rounded-xl bg-green-200/50" placeholder="搜索 AI 工具...">
</div>

<!-- 工具 -->
<div class="grid grid-cols-2 gap-6">

<div class="glass p-5">
🔥 热门工具

<div class="grid grid-cols-2 gap-4 mt-4">

<div class="glass p-3 card">ChatGPT</div>
<div class="glass p-3 card">Claude</div>
<div class="glass p-3 card">Midjourney</div>
<div class="glass p-3 card">Runway</div>
<div class="glass p-3 card">Notion AI</div>
<div class="glass p-3 card">Perplexity</div>

</div>
</div>

<div class="glass p-5">
天气
<h1 class="text-3xl mt-2">14°</h1>
</div>

</div>

<div class="glass p-6 text-center text-3xl">
时钟
<div id="clock"></div>
</div>

</div>
</div>

<script>
function updateClock(){
const now=new Date();
document.getElementById('clock').innerText=
now.toLocaleTimeString();
}
setInterval(updateClock,1000);
</script>

</body>
</html>

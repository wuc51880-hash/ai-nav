<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>AI猫导航 Pro</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont;
  background:#e9eef5;
}

/* ===== 通用拟态 ===== */
.neu{
  background:#e9eef5;
  border-radius:20px;
  box-shadow:
    8px 8px 16px #c9ced6,
    -8px -8px 16px #ffffff;
}

/* ===== 布局 ===== */
.container{
  display:flex;
}

/* ===== 左侧栏 ===== */
.sidebar{
  width:240px;
  padding:20px;
}

.logo{
  font-size:20px;
  margin-bottom:30px;
}

.menu{
  padding:14px;
  margin-bottom:12px;
  cursor:pointer;
}

/* ===== 主体 ===== */
.main{
  flex:1;
  padding:30px;
}

/* ===== 顶部区域 ===== */
.header{
  display:flex;
  justify-content:space-between;
  gap:20px;
}

.hero{
  flex:1;
}

/* 标题 */
.title{
  font-size:32px;
  font-weight:700;
}

/* 搜索 */
.search{
  margin-top:20px;
  padding:18px;
  border-radius:30px;
}

/* 分类入口 */
.quick{
  display:flex;
  gap:15px;
  margin-top:20px;
}

.quick-item{
  padding:15px;
  width:90px;
  text-align:center;
}

/* ===== 右侧信息卡 ===== */
.side-cards{
  width:260px;
  display:flex;
  flex-direction:column;
  gap:20px;
}

.info-card{
  padding:20px;
  text-align:center;
}

/* ===== 推荐卡片 ===== */
.section{
  margin-top:30px;
}

.section-title{
  font-weight:600;
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
}

.card{
  padding:25px;
  text-align:center;
  transition:.3s;
}

.card:hover{
  transform:translateY(-5px);
}

/* 图标容器 */
.icon{
  width:70px;
  height:70px;
  margin:0 auto 10px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:16px;

  box-shadow:
    inset 4px 4px 10px #c9ced6,
    inset -4px -4px 10px #ffffff;
}

/* 猫图 */
.cat-icon{
  width:50px;
  height:50px;
  object-fit:contain;
}

/* 文本 */
.name{font-weight:600;}
.desc{font-size:12px;color:#666;}

/* ===== 底部模块 ===== */
.bottom{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
  margin-top:30px;
}

.panel{
  padding:20px;
}

/* ===== 猫装饰 ===== */
.cat-fixed{
  position:fixed;
  width:100px;
  pointer-events:none;
}

.cat-left{left:20px;bottom:20px;}
.cat-right{right:20px;bottom:20px;}
</style>
</head>

<body>

<div class="container">

<!-- 左侧 -->
<div class="sidebar">
  <div class="logo">🐱 AI猫导航</div>

  <div class="menu neu">🏠 首页</div>
  <div class="menu neu">🤖 AI工具</div>
  <div class="menu neu">📁 分类</div>
  <div class="menu neu">⭐ 收藏</div>
</div>

<!-- 主体 -->
<div class="main">

<!-- 顶部 -->
<div class="header">

  <div class="hero">
    <div class="title">发现最佳 AI 工具</div>

    <div class="search neu">🔍 搜索 ChatGPT / Midjourney...</div>

    <div class="quick">
      <div class="quick-item neu">✍ 写作</div>
      <div class="quick-item neu">🎨 绘图</div>
      <div class="quick-item neu">💻 编程</div>
      <div class="quick-item neu">⚡ 效率</div>
    </div>
  </div>

  <!-- 右侧卡 -->
  <div class="side-cards">
    <div class="info-card neu">
      🌤 26°<br>晴
    </div>

    <div class="info-card neu">
      ⏰ <span id="time"></span>
    </div>
  </div>

</div>

<!-- 推荐 -->
<div class="section">
  <div class="section-title">🔥 热门推荐</div>

  <div class="grid">

    <div class="card neu">
      <div class="icon">
        <img src="images/cat_wave.png" class="cat-icon">
      </div>
      <div class="name">ChatGPT</div>
      <div class="desc">AI对话助手</div>
    </div>

    <div class="card neu">
      <div class="icon">
        <img src="images/cat_peek.png" class="cat-icon">
      </div>
      <div class="name">Midjourney</div>
      <div class="desc">AI绘画</div>
    </div>

    <div class="card neu">
      <div class="icon">
        <img src="images/cat_work.png" class="cat-icon">
      </div>
      <div class="name">Notion AI</div>
      <div class="desc">写作助手</div>
    </div>

    <div class="card neu">
      <div class="icon">
        <img src="images/cat_sleep.png" class="cat-icon">
      </div>
      <div class="name">Canva AI</div>
      <div class="desc">设计工具</div>
    </div>

    <div class="card neu">
      <div class="icon">
        <img src="images/cat_fight.png" class="cat-icon">
      </div>
      <div class="name">Runway</div>
      <div class="desc">视频生成</div>
    </div>

    <div class="card neu">
      <div class="icon">
        <img src="images/cat_christmas.png" class="cat-icon">
      </div>
      <div class="name">Copilot</div>
      <div class="desc">编程助手</div>
    </div>

  </div>
</div>

<!-- 底部 -->
<div class="bottom">

  <div class="panel neu">
    🆕 新工具发现<br><br>
    - Claude 3<br>
    - Perplexity<br>
    - Luma AI
  </div>

  <div class="panel neu">
    🏆 工具排行榜<br><br>
    1. ChatGPT<br>
    2. Midjourney<br>
    3. Notion AI
  </div>

</div>

</div>
</div>

<!-- 猫 -->
<img src="images/cat_peek.png" class="cat-fixed cat-left">
<img src="images/cat_christmas.png" class="cat-fixed cat-right">

<script>
/* 自动去白底 */
function removeWhiteBg(img){
  const canvas=document.createElement("canvas");
  const ctx=canvas.getContext("2d");

  canvas.width=img.width;
  canvas.height=img.height;

  ctx.drawImage(img,0,0);
  let data=ctx.getImageData(0,0,canvas.width,canvas.height);

  for(let i=0;i<data.data.length;i+=4){
    let r=data.data[i];
    let g=data.data[i+1];
    let b=data.data[i+2];

    if(r>240&&g>240&&b>240){
      data.data[i+3]=0;
    }
  }

  ctx.putImageData(data,0,0);
  img.src=canvas.toDataURL("image/png");
}

/* 执行 */
window.onload=()=>{
  document.querySelectorAll(".cat-icon").forEach(img=>{
    if(img.complete){
      removeWhiteBg(img);
    }else{
      img.onload=()=>removeWhiteBg(img);
    }
  });
};

/* 时间 */
setInterval(()=>{
  document.getElementById("time").innerText=
    new Date().toLocaleTimeString();
},1000);
</script>

</body>
</html>

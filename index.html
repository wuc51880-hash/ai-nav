<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>AI猫导航</title>

<style>
/* ===== 基础 ===== */
body{
  margin:0;
  font-family: -apple-system, BlinkMacSystemFont;
  background:#e6ebf3;
}

/* ===== 拟态通用 ===== */
.neu{
  background:#e6ebf3;
  border-radius:20px;
  box-shadow:
    10px 10px 20px #c5cad3,
    -10px -10px 20px #ffffff;
}

/* ===== 布局 ===== */
.container{
  display:flex;
}

/* ===== 左侧栏 ===== */
.sidebar{
  width:220px;
  padding:20px;
}

.logo{
  font-size:20px;
  margin-bottom:20px;
}

.menu{
  padding:12px;
  margin-bottom:15px;
  cursor:pointer;
}

/* ===== 主区域 ===== */
.main{
  flex:1;
  padding:30px;
}

/* ===== 标题 ===== */
.title{
  font-size:32px;
  font-weight:600;
  margin-bottom:20px;
}

/* ===== 搜索框 ===== */
.search{
  padding:18px;
  border-radius:30px;
  margin-bottom:20px;
}

/* ===== 分类按钮 ===== */
.tags{
  display:flex;
  gap:15px;
  margin-bottom:25px;
}

.tag{
  padding:10px 18px;
  border-radius:20px;
  font-size:14px;
}

/* ===== 卡片区 ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:30px;
}

.card{
  padding:30px;
  text-align:center;
  transition:.3s;
}

.card:hover{
  transform:translateY(-5px);
}

/* ===== 图标 ===== */
.card img{
  width:80px;
  margin-bottom:10px;
}

/* ===== 文字 ===== */
.name{
  font-weight:600;
}

.desc{
  font-size:13px;
  color:#666;
}

/* ===== 时间栏 ===== */
.footer{
  margin-top:40px;
  padding:20px;
  text-align:center;
  font-size:18px;
}

/* ===== 猫贴纸（重点） ===== */
.cat{
  position:absolute;
  width:120px;
  pointer-events:none;
}

/* 左下 */
.cat-left{
  left:20px;
  bottom:20px;
}

/* 右下 */
.cat-right{
  right:20px;
  bottom:20px;
}

/* 卡片附近小猫 */
.cat-small{
  width:80px;
  top:-20px;
  right:-10px;
}

.card-wrap{
  position:relative;
}
</style>
</head>

<body>

<div class="container">

  <!-- 左侧 -->
  <div class="sidebar">
    <div class="logo">🐱 AI猫导航</div>

    <div class="menu neu">🏠 首页</div>
    <div class="menu neu">🤖 AI工具</div>
    <div class="menu neu">📁 分类</div>
  </div>

  <!-- 主内容 -->
  <div class="main">

    <div class="title">发现最佳 AI 工具</div>

    <div class="search neu">🔍 搜索 AI 工具...</div>

    <div class="tags">
      <div class="tag neu">✍ 写作</div>
      <div class="tag neu">🎨 绘图</div>
      <div class="tag neu">💻 编程</div>
      <div class="tag neu">⚡ 效率</div>
    </div>

    <div class="grid">

      <div class="card-wrap">
        <div class="card neu">
         <img src="images/cat_wave.png" class="cat">
          <div class="name">ChatGPT</div>
          <div class="desc">AI对话助手</div>
        </div>
      </div>

      <div class="card-wrap">
        <div class="card neu">
         <img src="images/cat_peek.png" class="cat">
          <div class="name">Midjourney</div>
          <div class="desc">AI绘画工具</div>
        </div>
      </div>

      <div class="card-wrap">
        <div class="card neu">
          <img src="images/cat_work.png" class="cat">
          <div class="name">Notion AI</div>
          <div class="desc">写作助手</div>
        </div>
      </div>

      <div class="card-wrap">
        <div class="card neu">
          <img src="images/cat_sleep.png" class="cat">
          <div class="name">Canva AI</div>
          <div class="desc">设计工具</div>
        </div>
      </div>

      <div class="card-wrap">
        <div class="card neu">
          <img src="images/cat_fight.png" class="cat">
          <div class="name">Runway</div>
          <div class="desc">视频生成</div>
        </div>
      </div>

      <div class="card-wrap">
        <div class="card neu">
          <img src="images/cat_christmas.png" class="cat">
          <div class="name">Copilot</div>
          <div class="desc">编程助手</div>
        </div>
      </div>

    </div>

    <div class="footer neu">
      ⏰ <span id="time"></span>
    </div>

  </div>
</div>

<!-- ===== 猫贴纸（全局装饰）===== -->
<img src="images/cat_peek.png" class="cat cat-left">
<img src="images/cat_christmas.png" class="cat cat-right">

<script>
function updateTime(){
  const now = new Date();
  document.getElementById("time").innerText =
    now.toLocaleTimeString();
}
setInterval(updateTime,1000);
updateTime();
</script>

</body>
</html>

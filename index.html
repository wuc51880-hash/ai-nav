<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI猫导航</title>

<style>
/* ===== 全局 ===== */
body{
  margin:0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:#e6ecf5;
  display:flex;
}

/* ===== 拟态基础 ===== */
.neu{
  background:#e6ecf5;
  border-radius:20px;
  box-shadow: 8px 8px 16px #c8d0e0,
              -8px -8px 16px #ffffff;
}

.neu-inset{
  background:#e6ecf5;
  border-radius:20px;
  box-shadow: inset 6px 6px 12px #c8d0e0,
              inset -6px -6px 12px #ffffff;
}

/* ===== 左侧栏 ===== */
.sidebar{
  width:240px;
  padding:20px;
}

.logo{
  font-size:22px;
  font-weight:bold;
  margin-bottom:30px;
}

.menu{
  padding:15px;
  margin-bottom:15px;
  cursor:pointer;
  transition:0.3s;
}
.menu:hover{
  transform:translateY(-2px);
}

/* ===== 主体 ===== */
.main{
  flex:1;
  padding:30px;
}

/* ===== 标题 ===== */
.title{
  font-size:32px;
  font-weight:bold;
  margin-bottom:20px;
}

/* ===== 搜索 ===== */
.search{
  padding:15px;
  margin-bottom:25px;
}

/* ===== 分类按钮 ===== */
.categories{
  display:flex;
  gap:15px;
  margin-bottom:25px;
}

.cat-btn{
  padding:12px 20px;
  cursor:pointer;
  transition:0.2s;
}
.cat-btn:hover{
  transform:translateY(-3px);
}

/* ===== 卡片 ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.card{
  padding:20px;
  text-align:center;
  transition:0.3s;
}
.card:hover{
  transform:translateY(-5px);
}

/* ===== 小猫 ===== */
.cat{
  width:80px;
  margin-bottom:10px;
  transition:0.3s;
}

.cat:hover{
  transform:scale(1.1) rotate(-5deg);
}

/* ===== 装饰猫 ===== */
.float-cat{
  position:fixed;
  width:100px;
  animation:float 3s ease-in-out infinite;
}

.cat-left{
  left:20px;
  bottom:20px;
}

.cat-right{
  right:30px;
  bottom:30px;
}

@keyframes float{
  0%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
  100%{transform:translateY(0)}
}

/* ===== 时钟 ===== */
.clock{
  margin-top:30px;
  padding:20px;
  text-align:center;
  font-size:24px;
}

</style>
</head>

<body>

<!-- 左侧 -->
<div class="sidebar">
  <div class="logo">🐱 AI猫导航</div>

  <div class="menu neu">🏠 首页</div>
  <div class="menu neu">🤖 AI工具</div>
  <div class="menu neu">📂 分类</div>
</div>

<!-- 主体 -->
<div class="main">

  <div class="title">发现最佳 AI 工具</div>

  <div class="search neu-inset">
    🔍 搜索 AI 工具...
  </div>

  <!-- 分类 -->
  <div class="categories">
    <div class="cat-btn neu">✍ 写作</div>
    <div class="cat-btn neu">🎨 绘图</div>
    <div class="cat-btn neu">💻 编程</div>
    <div class="cat-btn neu">⚡ 效率</div>
  </div>

  <!-- 卡片 -->
  <div class="grid">

    <div class="card neu">
      <img src="images/cat_wave.png" class="cat">
      <h3>ChatGPT</h3>
      <p>AI对话助手</p>
    </div>

    <div class="card neu">
      <img src="images/cat_peek.png" class="cat">
      <h3>Midjourney</h3>
      <p>AI绘画工具</p>
    </div>

    <div class="card neu">
      <img src="images/cat_work.png" class="cat">
      <h3>Notion AI</h3>
      <p>写作助手</p>
    </div>

    <div class="card neu">
      <img src="images/cat_sleep.png" class="cat">
      <h3>Canva AI</h3>
      <p>设计工具</p>
    </div>

    <div class="card neu">
      <img src="images/cat_fight.png" class="cat">
      <h3>Runway</h3>
      <p>视频生成</p>
    </div>

    <div class="card neu">
      <img src="images/cat_christmas.png" class="cat">
      <h3>Copilot</h3>
      <p>编程助手</p>
    </div>

  </div>

  <!-- 时钟 -->
  <div class="clock neu">
    ⏰ <span id="clock"></span>
  </div>

</div>

<!-- 装饰猫 -->
<img src="images/cat_peek.png" class="float-cat cat-left">
<img src="images/cat_christmas.png" class="float-cat cat-right">

<!-- JS -->
<script>
function updateClock(){
  const now = new Date();
  document.getElementById('clock').innerText = now.toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();
</script>

</body>
</html>
